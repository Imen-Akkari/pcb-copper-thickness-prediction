<div class="container mt-4">
  <h2 class="text-primary mb-3 fw-bold text-custom-blue">
    <i class="bi bi-people"></i> Liste des Utilisateurs
  </h2>

  <div class="mb-3 d-flex justify-content-between align-items-center">
    <input type="text" class="form-control w-50" [(ngModel)]="searchText" placeholder="🔍 Rechercher...">
    <button class="btn btn-success ms-3" routerLink="/add-user">
  <i class="bi bi-person-plus"></i> Ajouter utilisateur
</button>
  </div>

  <div class="table-responsive">
    <table class="table table-hover table-bordered text-center">
      <thead class="table-light">
        <tr>
          <th>ID</th>
          <th>Email</th>
          <th>Rôle</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let user of filteredUsers">
          <td>{{ user.Id }}</td>
          <td>{{ user.Email }}</td>
          <td>{{ user.Role }}</td>
          <td>
  <button class="btn btn-danger btn-sm" (click)="deleteUser(user.Id)">
    <i class="bi bi-trash"></i> Supprimer
  </button>
</td>

        </tr>
      </tbody>
    </table>
  </div>
</div>
