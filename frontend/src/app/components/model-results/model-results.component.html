<div class="container mt-4">
  <h2>Résultats du modèle</h2>

  <div class="row g-2 align-items-end mt-2">
    <div class="col-sm-4">
      <label class="form-label">Date de début</label>
      <input class="form-control" [(ngModel)]="start" placeholder="25/07/2025" />
    </div>
    <div class="col-sm-4">
      <label class="form-label">Date de fin</label>
      <input class="form-control" [(ngModel)]="end" placeholder="12/08/2025" />
    </div>
    <div class="col-sm-4">
      <button class="btn btn-primary w-100" (click)="fetch()" [disabled]="loading">{{ loading ? 'Chargement…' : 'Filtrer' }}</button>
    </div>
  </div>

  <div *ngIf="error" class="alert alert-danger mt-3">{{ error }}</div>

  <div class="table-responsive mt-3">
    <table class="table table-striped table-bordered align-middle">
      <thead>
        <tr>
          <th>OF</th>
          <th>Mesure</th>
          <th>Prediction</th>
          <th>Proba</th>
          <th>Timestamp</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let p of data">
          <td>{{ p.num_of }}</td>
          <td>{{ p.value }}</td>
          <td>
            <span class="badge" [class.bg-danger]="p.prediction === 1" [class.bg-success]="p.prediction !== 1">
              {{ p.prediction === 1 ? 'Mesure hors tolérance' : 'Mesure OK' }}
            </span>
          </td>
          <td>{{ formatProba(p.proba) }}</td>
          <td>{{ p.timestamp | date:'short' }}</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
