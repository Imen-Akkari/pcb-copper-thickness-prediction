<div class="container d-flex justify-content-center align-items-center vh-100">
  <div class="card shadow p-4" style="max-width: 420px; width: 100%; border-radius: 1rem;">
    <h4 class="mb-3">Réinitialiser le mot de passe</h4>

    <div *ngIf="message" class="alert alert-success py-2">{{ message }}</div>
    <div *ngIf="error" class="alert alert-danger py-2">{{ error }}</div>

    <form (ngSubmit)="submit()">
      <div class="mb-3">
        <label class="form-label" for="rp-pass">Nouveau mot de passe</label>
        <input id="rp-pass" type="password" class="form-control" [(ngModel)]="password" name="password" required />
      </div>
      <div class="mb-3">
        <label class="form-label" for="rp-confirm">Confirmer le mot de passe</label>
        <input id="rp-confirm" type="password" class="form-control" [(ngModel)]="confirm" name="confirm" required />
      </div>
      <button class="btn btn-primary w-100" type="submit" [disabled]="loading">{{ loading ? 'Envoi…' : 'Mettre à jour' }}</button>
    </form>
  </div>
</div>
