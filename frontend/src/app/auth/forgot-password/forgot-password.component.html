<div class="container d-flex justify-content-center align-items-center vh-100">
  <div class="card shadow p-4" style="max-width: 420px; width: 100%; border-radius: 1rem;">
    <h4 class="mb-3">Mot de passe oublié</h4>
    <p class="text-muted small">Saisissez votre adresse email pour recevoir un lien de réinitialisation.</p>

    <div *ngIf="message" class="alert alert-info py-2">{{ message }}</div>
    <div *ngIf="error" class="alert alert-danger py-2">{{ error }}</div>

    <form (ngSubmit)="submit()" class="mt-2">
      <div class="mb-3">
        <label class="form-label" for="fp-email">Adresse Email</label>
        <input id="fp-email" type="email" class="form-control" [(ngModel)]="email" name="email" required placeholder="exemple@domaine.com" />
      </div>
      <button class="btn btn-primary w-100" type="submit" [disabled]="loading">{{ loading ? 'Envoi…' : 'Envoyer' }}</button>
    </form>
  </div>
</div>
